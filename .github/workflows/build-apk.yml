name: Build NEXUS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Android project
        run: |
          mkdir build-src
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found!"
            exit 1
          fi

          echo "Using: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d build-src
          cp gradle.properties build-src/gradle.properties

          echo "Project files:"
          find build-src -maxdepth 3 -type f | head -100

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.7"
         
          - name: Fix JVM target
  working-directory: build-src
  run: |
    find . -name "build.gradle" -o -name "build.gradle.kts" | while read f; do
      sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$f"
      sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' "$f"
      sed -i "s/jvmTarget = '\''1.8'\''/jvmTarget = '\''17'\''/g" "$f"
    done

      - name: Create Gradle wrapper
        working-directory: build-src
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build APK
        working-directory: build-src
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-APK
          path: build-src/app/build/outputs/apk/debug/app-debug.apk

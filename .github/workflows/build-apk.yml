name: Build NEXUS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Android project
        run: |
          mkdir -p build-src

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found!"
            exit 1
          fi

          echo "Using: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d build-src

          if [ -f "gradle.properties" ]; then
            cp gradle.properties build-src/gradle.properties
          fi

          find build-src -maxdepth 3 -type f | head -100

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Force JVM target to Java 17
        working-directory: build-src
        run: |
          cat >> gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          kotlin.jvm.target.validation.mode=warning
          EOF

          find . -name "build.gradle" -o -name "build.gradle.kts" | while read f; do
            echo "Processing $f"

            sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$f"
            sed -i 's/JavaVersion.VERSION_8/JavaVersion.VERSION_17/g' "$f"
            sed -i 's/sourceCompatibility[[:space:]]*=[[:space:]]*1\.8/sourceCompatibility = 17/g' "$f"
            sed -i 's/targetCompatibility[[:space:]]*=[[:space:]]*1\.8/targetCompatibility = 17/g' "$f"

            sed -i 's/jvmTarget[[:space:]]*=[[:space:]]*"1\.8"/jvmTarget = "17"/g' "$f"
            sed -i "s/jvmTarget[[:space:]]*=[[:space:]]*'1.8'/jvmTarget = '17'/g" "$f"
          done

          cat > force-jvm.gradle <<'EOF'
          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }

              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  kotlinOptions {
                      jvmTarget = "17"
                  }
              }
          }
          EOF

      - name: Create Gradle wrapper
        working-directory: build-src
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build APK
        working-directory: build-src
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace -I force-jvm.gradle

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-APK
          path: build-src/app/build/outputs/apk/debug/app-debug.apk
